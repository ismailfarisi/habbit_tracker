name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Retry: the Gradle distribution download from GitHub occasionally times out.
      - name: Build APK
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release && exit 0
            echo "Build attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/daily-discipline.apk

      - uses: actions/upload-artifact@v4
        with:
          name: daily-discipline-apk
          path: build/app/outputs/flutter-apk/daily-discipline.apk

      # Publish a direct download link (Releases page) for pushes, not PRs.
      - name: Publish latest build
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          make_latest: false
          body: |
            Latest Android build of Daily Discipline from commit ${{ github.sha }}.
            Download `daily-discipline.apk` on your phone and open it to install.
          files: build/app/outputs/flutter-apk/daily-discipline.apk
